services:

  php:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    volumes:
      - ../backend:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Runtime app config comes exclusively from backend/.env (single source of truth).
    # INHAZ_MODE only steers the entrypoint bootstrap; do NOT add APP_ENV / DB_* / CACHE_*
    # here — OS-level vars override .env and break Laravel's env cascade (and phpunit).
    environment:
      INHAZ_MODE: dev
    networks:
      - inhaz

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ../backend:/var/www/html
      - ./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx.dev.conf:/etc/nginx/http.d/default.conf:ro
    depends_on:
      - php
    networks:
      - inhaz

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: inhaz
      POSTGRES_USER: inhaz
      POSTGRES_PASSWORD: inhaz
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inhaz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - inhaz

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - inhaz

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - inhaz

volumes:
  pgdata:
  redisdata:
  vendor:

networks:
  inhaz:
    driver: bridge
