services:
  php:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/var/www/html
      - vendor:/var/www/html/vendor
    env_file:
      - ../backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inhaz

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: inhaz
      POSTGRES_USER: inhaz
      POSTGRES_PASSWORD: inhaz
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inhaz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - inhaz

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - inhaz

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - inhaz

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
      - rustfsdata:/data
    networks:
      - inhaz

volumes:
  pgdata:
  redisdata:
  rustfsdata:
  vendor:
  rustfsdata:

networks:
  inhaz:
    driver: bridge
