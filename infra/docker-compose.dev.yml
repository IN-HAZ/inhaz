services:

  php:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    volumes:
      - ../backend:/var/www/html
      - vendor:/var/www/html/vendor
    env_file:
      - path: ../.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: inhaz
      DB_USERNAME: inhaz
      DB_PASSWORD: inhaz
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    networks:
      - inhaz

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ../backend:/var/www/html
      - ./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx.dev.conf:/etc/nginx/http.d/default.conf:ro
    depends_on:
      - php
    networks:
      - inhaz

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: inhaz
      POSTGRES_USER: inhaz
      POSTGRES_PASSWORD: inhaz
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inhaz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - inhaz

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - inhaz

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - inhaz

volumes:
  pgdata:
  redisdata:
  vendor:

networks:
  inhaz:
    driver: bridge
